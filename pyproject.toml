[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdl-order"
version = "0.5.0"
description = "HDL compile-order analysis and project checks using VUnit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["vunit_hdl==4.7.1"]

[project.scripts]
hdl-order = "hdl_order.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
